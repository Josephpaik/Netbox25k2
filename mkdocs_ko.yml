site_name: NetBox 한국어 문서
site_dir: netbox/project-static/docs-ko
site_url: https://docs.netbox.dev/ko/
repo_name: netbox-community/netbox
repo_url: https://github.com/netbox-community/netbox
theme:
  name: material
  custom_dir: docs/_theme/
  language: ko
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - navigation.footer
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/lightbulb-outline
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/lightbulb
        name: 라이트 모드로 전환
plugins:
  - search:
      lang: ko
  - mkdocstrings:
      handlers:
        python:
          paths: ["netbox"]
          options:
            docstring_options:
              warn_missing_types: false
            heading_level: 3
            members_order: source
            show_root_heading: true
            show_root_full_path: false
            show_root_toc_entry: false
            show_source: false
extra:
  build_public: !ENV BUILD_PUBLIC
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/netbox-community/netbox
    - icon: fontawesome/brands/slack
      link: https://netdev.chat/
  alternate:
    - name: English
      link: https://docs.netbox.dev/
      lang: en
    - name: 한국어
      link: https://docs.netbox.dev/ko/
      lang: ko
extra_css:
    - extra.css
markdown_extensions:
    - admonition
    - attr_list
    - footnotes
    - md_in_html
    - pymdownx.emoji:
        emoji_index: !!python/name:material.extensions.emoji.twemoji
        emoji_generator: !!python/name:material.extensions.emoji.to_svg
    - pymdownx.superfences:
        custom_fences:
          - name: mermaid
            class: mermaid
            format: !!python/name:pymdownx.superfences.fence_code_format
    - pymdownx.tabbed:
        alternate_style: true
